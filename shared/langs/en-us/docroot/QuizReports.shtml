  <style>
    #quizReportsCard {
      max-width: 480px;
      margin: 0 auto;
    }
    #quizReportsCard p.intro { color: var(--text-black); }
    #quizReportsCard label {
      display: block;
      margin: 18px 0 6px 0;
      font-weight: 700;
      color: var(--bs-secondary-astronaut-blue);
    }
    #quizReportsCard input[type="date"] {
      font-family: 'Lato', sans-serif;
      font-size: 1em;
      padding: 8px 10px;
      border: 1px solid var(--bs-primary-light-blue);
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }
    #requestReportBtn {
      display: block;
      margin: 24px auto 0 auto;
      background: var(--bs-secondary-green);
      color: var(--pure-white);
      border: none;
      border-radius: 25px;
      padding: 12px 28px;
      font-family: 'Lato', sans-serif;
      font-size: 1em;
      font-weight: 700;
      cursor: pointer;
    }
    #requestReportBtn:hover { background: var(--bs-secondary-lighter-green); }
    #requestReportBtn:disabled { background: var(--hover-bg-grey); color: #888; cursor: not-allowed; }
    .quizReportsError {
      color: darkred;
      font-weight: 600;
      background: var(--soft-pink);
      border-radius: 8px;
      padding: 14px 18px;
    }
    #requestOutput {
      display: none;
      border-radius: 8px;
      padding: 14px 18px;
      margin-top: 24px;
      font-size: 0.95em;
    }
    #requestOutput.success {
      background: #e4f4e4;
      border: 1px solid #bfe0bf;
      color: #006300;
      font-weight: 600;
    }

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<body onload="initQuizReportsPage()">

%PROLOGUE%

    <div id="body">
        <div class="clearfix">
            <div class="item bottom-border">
                <h1>Quiz Reports</h1>

                <div id="quizReportsCard">
                  <p class="intro">Request a summary of your students' quiz results for any date range. We'll email you a report once it's ready.</p>

                  <div id="loginCheck">Checking your login status&hellip;</div>

                  <div id="notLoggedIn" class="quizReportsError" style="display:none;">
                    To request quiz reports, you must be <a href="https://bootstrapworld.org/my-account/">logged in</a> to your teacher account.
                  </div>

                  <form id="reportForm" style="display:none;" onsubmit="return requestReport(event)">
                    <label for="startDate">Start date</label>
                    <input type="date" id="startDate" name="startDate" required />

                    <label for="endDate">End date</label>
                    <input type="date" id="endDate" name="endDate" required />

                    <button type="submit" id="requestReportBtn">Send me results for this time period</button>
                  </form>

                  <div id="requestOutput"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
      // fetchUserHash() is a global, defined in lib/page-render.js (loaded
      // above). It in turn prefers the promise kicked off as early as
      // possible by lib/early-login-check.js, rather than firing its own
      // request from scratch.
      async function initQuizReportsPage() {
        const teacherId = await fetchUserHash();
        document.getElementById('loginCheck').style.display = 'none';

        if (!teacherId) {
          document.getElementById('notLoggedIn').style.display = 'block';
          return;
        }

        const form = document.getElementById('reportForm');
        form.dataset.teacherId = teacherId;
        form.style.display = 'block';
      }

      async function requestReport(event) {
        event.preventDefault();

        const form   = document.getElementById('reportForm');
        const start  = document.getElementById('startDate').value;
        const end    = document.getElementById('endDate').value;
        const output = document.getElementById('requestOutput');
        const btn    = document.getElementById('requestReportBtn');

        output.style.display = 'none';
        output.className = '';

        if (start > end) {
          output.className = 'quizReportsError';
          output.style.display = 'block';
          output.textContent = 'Start date must be on or before the end date.';
          return false;
        }

        btn.disabled = true;
        btn.textContent = 'Sending request…';

        try {
          const response = await fetch('https://bootstrapworld.org/data/RequestReport.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              teacher_hash: form.dataset.teacherId,
              start_date: start,
              end_date: end
            })
          });
          const data = await response.json();
          output.style.display = 'block';
          if (data.success) {
            btn.style.display = 'none';
            output.className = 'success';
            output.textContent = data.message;
          } else {
            output.className = 'quizReportsError';
            output.textContent = data.error || 'Something went wrong. Please try again.';
            btn.disabled = false;
            btn.textContent = 'Send me results for this time period';
          }
        } catch (err) {
          output.style.display = 'block';
          output.className = 'quizReportsError';
          output.textContent = 'Network error. Please check your connection and try again.';
          btn.disabled = false;
          btn.textContent = 'Send me results for this time period';
        }

        return false;
      }
    </script>

%EPILOGUE%


</html>
