name: fork branches so fall is live and main becomes workspace for next year
on:
  schedule:
    # run at minute 0, hour 0, on the 1st of September
    # ? means "ignore the day of the week"
    - cron: 0 0 1 SEP ?

jobs:
  create_issue:
    name: Fork Fall and Main branches
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create Issue
        run: |
          if [[ $CLOSE_PREVIOUS == true ]]; then
            previous_issue_number=$(gh issue list \
              --label "$LABELS" \
              --json number \
              --jq '.[0].number')
            if [[ -n $previous_issue_number ]]; then
              gh issue close "$previous_issue_number"
              gh issue unpin "$previous_issue_number"
            fi
          fi
          new_issue_url=$(gh issue create \
            --title "$TITLE" \
            --assignee "$ASSIGNEES" \
            --label "$LABELS" \
            --body "$BODY")
          if [[ $PINNED == true ]]; then
            gh issue pin "$new_issue_url"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Fork Fall and Main Branches
          ASSIGNEES: schanzer
          LABELS: Infrastructure
          BODY: |
            - [ ] fork branches so fall is live and main becomes workspace for next year
            - [ ] Find and replace "fall20XY" in starter-files.json on main to point to "refs/heads/main"

          PINNED: false
          CLOSE_PREVIOUS: false
