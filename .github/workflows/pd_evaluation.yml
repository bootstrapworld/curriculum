name: PD Evaluation
on:
  schedule:
    # run at minute 0, hour 0, on the 1st of February.
    # GitHub Actions cron only supports numeric fields and *,-,,,/ -- no
    # month names and no "?" -- so month is "2" and day-of-week is "*".
    - cron: '0 0 1 2 *'
  workflow_dispatch: {}

jobs:
  create_issue:
    name: PD Evaluation
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create Issue
        run: |
          if [[ $CLOSE_PREVIOUS == true ]]; then
            previous_issue_number=$(gh issue list \
              --label "$LABELS" \
              --json number \
              --jq '.[0].number')
            if [[ -n $previous_issue_number ]]; then
              gh issue close "$previous_issue_number"
              gh issue unpin "$previous_issue_number"
            fi
          fi
          new_issue_url=$(gh issue create \
            --title "$TITLE" \
            --assignee "$ASSIGNEES" \
            --label "$LABELS" \
            --body "$BODY")
          if [[ $PINNED == true ]]; then
            gh issue pin "$new_issue_url"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: PD Evaluation
          # env values must be plain strings, not YAML lists; gh's --assignee
          # accepts a comma-separated list of logins in one flag.
          ASSIGNEES: schanzer,flannery-denny,joystraub
          LABELS: Evaluation
          BODY: |
            Audit PD Evaluations from last year and spec what changes might be worthwhile 

            - [ ] AI
            - [ ] Expressions and Equations
            - [ ] Data Science
            - [ ] Algebra 1
            - [ ] Algebra 2
            - [ ] Send to SK for review April/May
            - [ ] Send to KF for review on Memorial Day

          PINNED: false
          CLOSE_PREVIOUS: false
